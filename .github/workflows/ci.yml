name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  migracao:
    name: migracao (COBOL, C#, VB.NET, Object Pascal, SQL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: GnuCOBOL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnucobol
          # Falha ALTO se nao instalou: sem o COBOL nao ha especificacao
          # contra a qual comparar, e a suite inteira perde o sentido.
          cobc --version | head -1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Free Pascal (o cliente desktop)
        run: |
          sudo apt-get install -y -qq fp-compiler
          # Falha ALTO se nao instalou: a suite em modo exigente trata
          # ausencia como defeito do ambiente, e e melhor falhar aqui com o
          # nome do pacote do que la com "fpc ausente".
          fpc -iV

      - name: PostgreSQL e SQLite (a implementacao em SQL)
        # O PostgreSQL e o alvo: `NUMERIC` exato, e `ROUND` meio para longe de
        # zero POR OMISSAO -- igual ao `ROUNDED` do COBOL.
        #
        # O SQLite entra para a DIVERGENCIA PREVISTA: la `NUMERIC` e afinidade
        # e nao tipo, `CAST('120' AS NUMERIC)` vira integer, e a divisao
        # trunca. A suite EXIGE que ele erre; se passar a bater, o README
        # ficou obsoleto e o teste falha.
        #
        # Sem este passo, o P13_EXIGE=1 transformava os dois pulados em falha
        # -- que foi exatamente o que aconteceu, e e o comportamento certo: a
        # suite nao passou verde tendo verificado menos do que promete.
        run: |
          sudo apt-get install -y -qq postgresql postgresql-client sqlite3
          sudo service postgresql start
          for _ in $(seq 1 30); do
            sudo -n -u postgres psql -tAc 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          sudo -n -u postgres psql -tAc 'SELECT version()'
          sqlite3 --version

      - name: a suite, em modo exigente
        # P13_EXIGE=1 transforma "pulado" em FALHA: no CI, uma implementacao
        # ausente significa que a equivalencia nao foi provada.
        env:
          P13_EXIGE: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: ./verifica.sh

      - name: os dados gerados estao em dia
        # dados/contas.dat e COMMITADO, porque e a entrada do lote e precisa
        # ser legivel por quem le o FORMATO.md. Se o gerador mudar e o arquivo
        # nao for regerado, o repositorio mostra uma coisa e verifica outra.
        run: |
          python3 dados/gera.py
          git diff --exit-code -- dados/ \
            || { echo 'dados/contas.dat desatualizado: rode dados/gera.py'; exit 1; }
